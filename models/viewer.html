<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZaapRush Bestiaire 3D</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Visionneuse : scène claire et neutre, interface sombre en surimpression */
:root {
  color-scheme: light;
  --ground: #eceae6;
  --ink: #1e1530;
  --ink-2: #4a4060;
  --panel: rgba(30, 21, 48, 0.9);
  --panel-line: #4a3b6b;
  --on-panel: #f4ecdd;
  --on-panel-2: #b9aecf;
  --gold: #f2c14e;
  --font-title: "Fredoka", "Nunito", system-ui, sans-serif;
  --font-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
}
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--ground); color: var(--ink); font-family: var(--font-body); }
#stage { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
button { font: inherit; color: inherit; }

.bar { position: fixed; left: 0; right: 0; top: 0; z-index: 2; display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
  padding: max(12px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px));
  background: var(--panel); color: var(--on-panel); }
.bar h1 { margin: 0; font-family: var(--font-title); font-weight: 700; font-size: 24px; margin-right: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 12px; font-weight: 800; font-size: 13px;
  background: rgba(255,255,255,.08); border: 1px solid var(--panel-line); white-space: nowrap; font-variant-numeric: tabular-nums; }
.chip b { color: var(--on-panel-2); font-weight: 700; }
.rarity { color: #1a1030; border: none; letter-spacing: 1px; }
.tabs { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }
.tab { border: 1px solid var(--panel-line); background: transparent; border-radius: 10px; padding: 6px 12px; font-weight: 800; font-size: 13px; cursor: pointer; min-height: 36px; }
.tab.on { background: var(--gold); color: #3a2400; border-color: var(--gold); }
.tab:disabled { opacity: .45; cursor: not-allowed; }
.picks { display: flex; gap: 6px; width: 100%; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; }
.picks:empty { display: none; }
.pick { flex: none; border: 1px solid var(--panel-line); background: rgba(255,255,255,.06); border-radius: 999px; padding: 4px 12px; font-weight: 800; font-size: 13px; cursor: pointer; min-height: 32px; }
.pick.on { background: var(--on-panel); color: var(--ink); border-color: var(--on-panel); }

.dock { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(16px, env(safe-area-inset-bottom, 0px)); z-index: 2;
  display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; background: var(--panel); color: var(--on-panel);
  border-radius: 18px; padding: 10px 12px; max-width: calc(100% - 32px); }
.group { display: flex; gap: 6px; align-items: center; }
.group span { font-size: 11px; font-weight: 900; letter-spacing: 1.5px; color: var(--on-panel-2); margin-right: 2px; }
.sep { width: 1px; background: var(--panel-line); align-self: stretch; }
.btn { min-height: 40px; padding: 6px 14px; border-radius: 12px; border: 1px solid var(--panel-line); background: rgba(255,255,255,.06); font-weight: 800; font-size: 14px; cursor: pointer; }
.btn:hover { background: rgba(255,255,255,.14); }
.btn.on { background: var(--gold); color: #3a2400; border-color: var(--gold); }
.btn:focus-visible, .tab:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.hint { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: 96px; z-index: 1; font-size: 12px; font-weight: 700; color: var(--ink-2);
  background: rgba(255,255,255,.7); border-radius: 10px; padding: 6px 10px; max-width: 260px; }
.toast { position: fixed; left: 50%; top: 96px; transform: translateX(-50%); z-index: 3; background: var(--panel); color: var(--on-panel);
  padding: 8px 14px; border-radius: 12px; font-weight: 800; font-size: 14px; pointer-events: none; }
.toast[hidden] { display: none; }

@media (max-width: 700px) {
  .bar h1 { font-size: 19px; width: 100%; }
  .tabs { margin-left: 0; width: 100%; }
  .dock { gap: 8px; padding: 8px; }
  .group span { display: none; }
  .sep { display: none; }
  .btn { padding: 6px 10px; font-size: 13px; }
  .hint { display: none; }
}
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>
<body>
<canvas id="stage" aria-label="Visionneuse 3D de la créature"></canvas>

<header class="bar">
  <h1 id="c-name">Cra Feu</h1>
  <span class="chip rarity" id="c-rarity">LÉGENDAIRE</span>
  <span class="chip"><b>Drop</b><span id="c-drop">0,5 %</span></span>
  <span class="chip"><b>Taille</b><span id="c-size">2,4 m</span></span>
  <span class="chip"><b>Triangles</b><span id="c-tris">0</span></span>
  <nav class="tabs" id="tabs" aria-label="Groupes de créatures"></nav>
  <nav class="picks" id="picks" aria-label="Créatures du groupe"></nav>
</header>

<div class="dock">
  <div class="group" role="group" aria-label="Animation">
    <span>ANIM</span>
    <button class="btn on" data-anim="idle">Idle</button>
    <button class="btn" data-anim="move">Move</button>
    <button class="btn" data-anim="ability">Ability</button>
    <button class="btn" data-anim="still">Still</button>
  </div>
  <div class="sep"></div>
  <div class="group" role="group" aria-label="Vue">
    <span>VUE</span>
    <button class="btn" data-view="34">3/4</button>
    <button class="btn" data-view="face">Face</button>
    <button class="btn" data-view="side">Profil</button>
  </div>
  <div class="sep"></div>
  <div class="group" role="group" aria-label="Export">
    <span>EXPORT</span>
    <button class="btn" id="exp-glb">GLB</button>
    <button class="btn" id="exp-obj">OBJ</button>
  </div>
</div>

<div class="hint">Clic gauche : tourner · Clic droit : déplacer · Molette : zoom</div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/OBJExporter.js"></script>
<script src="../js/models/core.js"></script>
<script src="../js/models/cra-feu.js"></script>
<script src="../js/models/modo.js"></script>
<script src="../js/models/bestiaire.js"></script>
<script src="../js/models/monstres.js"></script>
<script>
'use strict';
/* =====================================================================
   Catalogue : les créatures et leurs groupes (Rounds)
   ===================================================================== */
const RARITY = {
  COMMUN: '#c9c4bb', RARE: '#5aa9ff', 'ÉPIQUE': '#b48cff', 'LÉGENDAIRE': '#f2a03c', MYTHIQUE: '#ff5f8a',
};
const MONSTER_NAMES = {
  bouftou: 'Bouftou', tofu: 'Tofu', piou: 'Piou Rouge', larve_bleue: 'Larve Bleue', sanglier: 'Sanglier', arakne: 'Arakne',
  moskito: 'Moskito', prespic: 'Prespic', abraknyde: 'Abraknyde', chafer: 'Chafer', chafer_archer: 'Chafer Archer',
  fantome: 'Fantôme Pandore', craqueleur: 'Craqueleur', bwork: 'Bwork', gelee: 'Gelée Bleue', bwork_mage: 'Bwork Mage',
  mansot: 'Mansot', boufmouth: 'Boufmouth', sapik: 'Sapik', fecorce: 'Fécorce',
};
/** Rayon de collision des monstres dans le jeu (pixels) : sert à les montrer à leur taille de partie. */
const MONSTER_R = { bouftou: 14, tofu: 9, piou: 9, larve_bleue: 13, sanglier: 15, arakne: 11, moskito: 9, prespic: 14, abraknyde: 16, chafer: 12,
  chafer_archer: 12, fantome: 11, craqueleur: 18, bwork: 14, gelee: 13, bwork_mage: 14, mansot: 13, boufmouth: 16, sapik: 15, fecorce: 13 };
/** Monstre ordinaire dans la visionneuse : modèle complet (non fusionné) à sa taille de jeu, animé comme en partie. */
function monsterCreature(id) {
  const root = new THREE.Group();
  root.name = 'monstre_' + id;
  const holder = new THREE.Group();
  const model = MONSTER_MODELS[id].build();
  const box3 = new THREE.Box3().setFromObject(model);
  const rad = Math.max(box3.max.x - box3.min.x, box3.max.z - box3.min.z) / 2 || 1;
  const k = ((MONSTER_R[id] / 32) * 1.25) / rad;
  model.scale.multiplyScalar(k);
  model.position.set(-(box3.min.x + box3.max.x) / 2 * k, -box3.min.y * k, -(box3.min.z + box3.max.z) / 2 * k);
  holder.add(model);
  root.add(holder);
  const h = (box3.max.y - box3.min.y) * k, pose = {};
  return {
    root, fx: new THREE.Group(),
    update(mode, t) {
      if (mode === 'still') { holder.position.set(0, 0, 0); holder.scale.set(1, 1, 1); holder.rotation.set(0, 0, 0); return; }
      monsterPose(MONSTER_MODELS[id].anim, t * (mode === 'move' ? 1 : 0.5), 0, pose);
      holder.position.y = pose.y * h;
      holder.scale.set(pose.sx, pose.sy, pose.sz);
      holder.rotation.set(pose.rx, pose.yaw, pose.rz, 'YXZ');
    },
  };
}
const CREATURES = [
  { id: 'cra_feu', name: 'Cra Feu', rarity: 'LÉGENDAIRE', drop: 0.5, round: 'r1', build: buildCraFeu },
  { id: 'modo_iop', name: 'Iop Modo', rarity: 'MYTHIQUE', drop: 0.1, round: 'r2', build: buildModoIop },
  { id: 'modo_cra', name: 'Cra Modo', rarity: 'MYTHIQUE', drop: 0.1, round: 'r2', build: buildModoCra },
  { id: 'modo_feca', name: 'Féca Modo', rarity: 'MYTHIQUE', drop: 0.1, round: 'r2', build: buildModoFeca },
  { id: 'modo_eniripsa', name: 'Eniripsa Modo', rarity: 'MYTHIQUE', drop: 0.1, round: 'r2', build: buildModoEniripsa },
  { id: 'modo_sram', name: 'Sram Modo', rarity: 'MYTHIQUE', drop: 0.1, round: 'r2', build: buildModoSram },
  { id: 'modo_xelor', name: 'Xélor Modo', rarity: 'MYTHIQUE', drop: 0.1, round: 'r2', build: buildModoXelor },
  { id: 'modo_osamodas', name: 'Osamodas Modo', rarity: 'MYTHIQUE', drop: 0.1, round: 'r2', build: buildModoOsamodas },
  { id: 'modo_sacrieur', name: 'Sacrieur Modo', rarity: 'MYTHIQUE', drop: 0.08, round: 'r2', build: buildModoSacrieur },
  { id: 'modo_enutrof', name: 'Enutrof Modo', rarity: 'MYTHIQUE', drop: 0.08, round: 'r2', build: buildModoEnutrof },
  { id: 'modo_roublard', name: 'Roublard Modo', rarity: 'MYTHIQUE', drop: 0.08, round: 'r2', build: buildModoRoublard },
  { id: 'modo_ecaflip', name: 'Écaflip Modo', rarity: 'MYTHIQUE', drop: 0.05, round: 'r2', build: buildModoEcaflip },
  { id: 'modo_pandawa', name: 'Pandawa Modo', rarity: 'MYTHIQUE', drop: 0.05, round: 'r2', build: buildModoPandawa },
  { id: 'modo_sadida', name: 'Sadida Modo', rarity: 'MYTHIQUE', drop: 0.05, round: 'r2', build: buildModoSadida },
  { id: 'tofu_bagarreur', name: 'Tofu Bagarreur', rarity: 'COMMUN', drop: 35, round: 'r3', build: buildTofuBagarreur },
  { id: 'wabbit_lunaire', name: 'Wabbit Lunaire', rarity: 'ÉPIQUE', drop: 3, round: 'r3', build: buildWabbitLunaire },
  { id: 'dragoeuf_celeste', name: 'Dragoeuf Céleste', rarity: 'MYTHIQUE', drop: 0.2, round: 'r3', build: buildDragoeufCeleste },
  { id: 'tofu_royal', name: 'Tofu Royal', rarity: 'ÉPIQUE', drop: 5, round: 'r4', build: buildTofuRoyal },
  { id: 'bouftou_royal', name: 'Bouftou Royal', rarity: 'LÉGENDAIRE', drop: 1.5, round: 'r4', build: buildBouftouRoyal },
  { id: 'black_wabbit', name: 'Black Wabbit', rarity: 'ÉPIQUE', drop: 4, round: 'r4', build: buildBlackWabbit },
  { id: 'dragon_cochon', name: 'Dragon Cochon', rarity: 'LÉGENDAIRE', drop: 1, round: 'r4', build: buildDragonCochon },
  { id: 'abrak_ancestral', name: 'Abraknyde Ancestral', rarity: 'ÉPIQUE', drop: 3, round: 'r4', build: buildAbraknydeAncestral },
  { id: 'chene_mou', name: 'Le Chêne Mou', rarity: 'LÉGENDAIRE', drop: 0.8, round: 'r4', build: buildCheneMou },
  { id: 'craq_plaines', name: 'Craqueleur des Plaines', rarity: 'ÉPIQUE', drop: 3, round: 'r4', build: buildCraqueleurPlaines },
  { id: 'craq_legendaire', name: 'Craqueleur Légendaire', rarity: 'LÉGENDAIRE', drop: 0.5, round: 'r4', build: buildCraqueleurLegendaire },
  { id: 'mansot_royal', name: 'Mansot Royal', rarity: 'ÉPIQUE', drop: 2, round: 'r4', build: buildMansotRoyal },
  { id: 'obsidiantre', name: 'Obsidiantre', rarity: 'LÉGENDAIRE', drop: 0.3, round: 'r4', build: buildObsidiantre },
  // Monstres ordinaires du jeu, à leur taille réelle (tels qu'utilisés en partie)
  ...['bouftou', 'tofu', 'piou', 'larve_bleue', 'sanglier', 'arakne', 'moskito', 'prespic', 'abraknyde', 'chafer', 'chafer_archer',
    'fantome', 'craqueleur', 'bwork', 'gelee', 'bwork_mage', 'mansot', 'boufmouth', 'sapik', 'fecorce']
    .map((id) => ({ id, name: MONSTER_NAMES[id], rarity: 'COMMUN', drop: null, round: 'r5', build: () => monsterCreature(id) })),
];
const ROUNDS = [
  { id: 'r1', label: 'Round 1 · Légendaire' },
  { id: 'r2', label: 'Round 2 · Boss Modo' },
  { id: 'r3', label: 'Round 3 · Familiers' },
  { id: 'r4', label: 'Round 4 · Boss du jeu' },
  { id: 'r5', label: 'Round 5 · Monstres' },
  { id: 'lineup', label: 'Full lineup' },
];

/* =====================================================================
   Scène, lumière, sol, mannequin d'échelle, lune
   ===================================================================== */
const canvas = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeceae6);
scene.fog = new THREE.Fog(0xeceae6, 18, 40);

const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 800);
const controls = new THREE.OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 1.5;
controls.maxDistance = 400;
controls.maxPolarAngle = Math.PI * 0.49;

scene.add(new THREE.HemisphereLight(0xffffff, 0xd8d2c8, 0.75));
const sun = new THREE.DirectionalLight(0xffffff, 0.9);
sun.position.set(4, 8, 5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.radius = 6;
sun.shadow.bias = -0.0005;
Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8, near: 1, far: 30 });
scene.add(sun);

// Sol blanc qui reçoit l'ombre portée
const floor = new THREE.Mesh(new THREE.CylinderGeometry(14, 14, 0.1, 64), new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1 }));
floor.position.y = -0.05;
floor.receiveShadow = true;
scene.add(floor);

// Lune en arrière-plan
const moon = new THREE.Group();
moon.add(new THREE.Mesh(new THREE.SphereGeometry(2.2, 20, 14), mat(0xf3ead6, 0.15)));
for (const [x, y, r] of [[0.6, 0.5, 0.4], [-0.7, -0.3, 0.55], [0.2, -0.9, 0.3], [-0.2, 0.9, 0.25]]) {
  const c = new THREE.Mesh(new THREE.SphereGeometry(r, 10, 8), mat(0xe0d4ba, 0.1));
  c.position.set(x, y, 1.85);
  moon.add(c);
}
moon.position.set(-6, 7, -14);
scene.add(moon);

/** Mannequin gris de 1,80 m pour l'échelle. */
function buildMannequin() {
  const g = new THREE.Group();
  g.name = 'Mannequin_1m80';
  const m = mat(0x9a9894);
  g.add(at(box(0.36, 0.56, 0.2, m), 0, 1.2, 0));
  g.add(at(box(0.24, 0.24, 0.22, m), 0, 1.66, 0));
  for (const s of [-1, 1]) {
    g.add(at(box(0.11, 0.6, 0.12, m), s * 0.25, 1.17, 0));
    g.add(at(box(0.14, 0.88, 0.15, m), s * 0.1, 0.46, 0));
  }
  g.add(at(box(0.36, 0.04, 0.2, mat(0x7a7874)), 0, 1.8, 0));
  return g;
}
const mannequin = buildMannequin();
scene.add(mannequin);

/* =====================================================================
   État de la visionneuse
   ===================================================================== */
let mode = 'idle';
let current = [];       // instances affichées { def, inst }
let roundId = 'r1';
let pickId = null;     // créature choisie dans le Round affiché
let viewName = '34';
const clock = new THREE.Clock();
let time = 0;

function countTris(obj) {
  let n = 0;
  obj.traverse((o) => {
    if (o.isMesh) n += o.geometry.index ? o.geometry.index.count / 3 : o.geometry.attributes.position.count / 3;
  });
  return Math.round(n);
}
// Taille du corps seul : on ignore l'aura et les objets qui gravitent autour
const NOT_BODY = /^(aura|pierre_|engrenage_|cristaux_orbite|cristal_)/;
function sizeOf(obj) {
  obj.updateMatrixWorld(true);
  const b = new THREE.Box3(), tmpBox = new THREE.Box3();
  (function walk(o) {
    if (NOT_BODY.test(o.name)) return;
    if (o.isMesh) {
      if (!o.geometry.boundingBox) o.geometry.computeBoundingBox();
      b.union(tmpBox.copy(o.geometry.boundingBox).applyMatrix4(o.matrixWorld));
    }
    o.children.forEach(walk);
  })(obj);
  const s = new THREE.Vector3();
  b.getSize(s);
  return { box: b, h: s.y, w: Math.max(s.x, s.z) };
}

function clearScene() {
  for (const c of current) { scene.remove(c.inst.root); scene.remove(c.inst.fx); }
  current = [];
}

function showRound(id) {
  roundId = id;
  clearScene();
  const group = id === 'lineup' ? CREATURES : CREATURES.filter((c) => c.round === id);
  if (!group.some((c) => c.id === pickId)) pickId = group[0].id;
  // Dans un Round, une créature à la fois ; le lineup les aligne toutes
  const list = id === 'lineup' ? group : group.filter((c) => c.id === pickId);
  // Chaque créature prend la place de sa largeur (corps seul) + une marge
  const built = list.map((def) => { const inst = def.build(); inst.update('still', 0, 0); return { def, inst, w: sizeOf(inst.root).w }; });
  const total = built.reduce((n, c) => n + c.w + 1.4, -1.4);
  let x = -total / 2;
  for (const c of built) {
    c.inst.root.position.x = list.length > 1 ? x + c.w / 2 : 0;
    x += c.w + 1.4;
    scene.add(c.inst.root, c.inst.fx);
    current.push({ def: c.def, inst: c.inst });
  }
  // Mannequin à gauche de la rangée, sol et brouillard adaptés à la largeur
  const half = list.length > 1 ? total / 2 : 0;
  // Mannequin juste à gauche, à une distance qui dépend de la largeur de la créature
  const firstW = current.length ? sizeOf(current[0].inst.root).w : 1;
  mannequin.position.set(-half - Math.max(1.1, firstW * 0.6 + 0.6), 0, 0.3);
  const span = Math.max(14, half + 8);
  floor.scale.set(span / 14, 1, Math.max(1, span / 28));
  scene.fog.near = Math.max(18, span * 1.4);
  scene.fog.far = Math.max(40, span * 3.2);
  Object.assign(sun.shadow.camera, { left: -span, right: span, top: span * 0.6, bottom: -span * 0.6 });
  sun.shadow.camera.updateProjectionMatrix();
  updateInfo();
  renderTabs();
  renderPicks(id === 'lineup' ? [] : group);
  setView(viewName, true);
}

function renderPicks(group) {
  const nav = document.getElementById('picks');
  nav.innerHTML = '';
  if (group.length < 2) return;
  for (const c of group) {
    const b = document.createElement('button');
    b.className = 'pick' + (c.id === pickId ? ' on' : '');
    b.textContent = c.name;
    b.addEventListener('click', () => { pickId = c.id; showRound(roundId); });
    nav.appendChild(b);
  }
  const on = nav.querySelector('.on');
  if (on) on.scrollIntoView({ block: 'nearest', inline: 'center' });
}

function updateInfo() {
  const first = current[0];
  if (!first) return;
  const lineup = roundId === 'lineup' && current.length > 1;
  const def = first.def;
  document.getElementById('c-name').textContent = lineup ? `Lineup · ${current.length} créatures` : def.name;
  const r = document.getElementById('c-rarity');
  r.textContent = lineup ? 'TOUTES' : def.rarity;
  r.style.background = lineup ? '#f4ecdd' : RARITY[def.rarity];
  document.getElementById('c-drop').textContent = lineup || def.drop == null ? '—' : def.drop.toLocaleString('fr-FR') + ' %';
  for (const c of current) c.inst.update('still', 0, 0);
  const h = Math.max(...current.map((c) => sizeOf(c.inst.root).h));
  document.getElementById('c-size').textContent = h.toLocaleString('fr-FR', { maximumFractionDigits: 1 }) + ' m';
  const tris = current.reduce((n, c) => n + countTris(c.inst.root), 0);
  document.getElementById('c-tris').textContent = tris.toLocaleString('fr-FR');
}

function renderTabs() {
  const nav = document.getElementById('tabs');
  nav.innerHTML = '';
  for (const r of ROUNDS) {
    const b = document.createElement('button');
    b.className = 'tab' + (r.id === roundId ? ' on' : '');
    b.textContent = r.soon ? r.label + ' (bientôt)' : r.label;
    b.disabled = !!r.soon;
    b.addEventListener('click', () => showRound(r.id));
    nav.appendChild(b);
  }
}

/* ---------------------------------------------------------------- Caméra */
function setView(name, instant) {
  viewName = name;
  const boxAll = new THREE.Box3();
  for (const c of current) boxAll.expandByObject(c.inst.root);
  boxAll.expandByObject(mannequin);
  const center = new THREE.Vector3(), size = new THREE.Vector3();
  boxAll.getCenter(center);
  boxAll.getSize(size);
  // FZ : on vise un peu devant les créatures, là où tombent les effets d'Ability
  const FZ = current.length > 1 ? 0 : 1.2;
  const r = current.length > 1 ? Math.max((size.x / 2) / (Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.aspect) * 1.3 / 0.92, 8) : Math.max(size.y * 2.25, size.x * 1.3, 4.4);
  const pos = {
    '34': new THREE.Vector3(center.x + r * (current.length > 1 ? 0.08 : 0.62), center.y + r * 0.32, FZ + r * 0.92),
    face: new THREE.Vector3(center.x, center.y + r * 0.12, FZ + r * 1.1),
    side: new THREE.Vector3(center.x + r * 1.1, center.y + r * 0.12, FZ),
  }[name];
  // Brouillard réglé sur la distance de la caméra : le fond s'estompe, jamais les créatures
  scene.fog.near = r * 1.6;
  scene.fog.far = r * 4;
  camTarget = { pos, look: new THREE.Vector3(center.x, size.y * 0.42, FZ), k: instant ? 1 : 0 };
  document.querySelectorAll('[data-view]').forEach((b) => b.classList.toggle('on', b.dataset.view === name));
}
let camTarget = null;

/* ---------------------------------------------------------------- Export GLB / OBJ */
// Dans un artefact claude.ai, les fichiers passent par la capacité "downloads",
// qui n'accepte pas .glb/.obj : on les emballe alors dans un .zip.
let downloadsApi = null;
if (window.claude && typeof window.claude.use === 'function') {
  window.claude.use('downloads').then((d) => { downloadsApi = d; }).catch(() => {});
}

const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
  return t;
})();
function crc32(bytes) {
  let c = 0xffffffff;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);
  return (c ^ 0xffffffff) >>> 0;
}
/** Archive .zip minimale, sans compression (méthode "stored"), d'un seul fichier. */
function zipOne(name, bytes) {
  const nameB = new TextEncoder().encode(name);
  const crc = crc32(bytes);
  const local = new DataView(new ArrayBuffer(30));
  local.setUint32(0, 0x04034b50, true); local.setUint16(4, 20, true);
  local.setUint32(14, crc, true); local.setUint32(18, bytes.length, true); local.setUint32(22, bytes.length, true);
  local.setUint16(26, nameB.length, true);
  const central = new DataView(new ArrayBuffer(46));
  central.setUint32(0, 0x02014b50, true); central.setUint16(4, 20, true); central.setUint16(6, 20, true);
  central.setUint32(16, crc, true); central.setUint32(20, bytes.length, true); central.setUint32(24, bytes.length, true);
  central.setUint16(28, nameB.length, true);
  const centralOffset = 30 + nameB.length + bytes.length;
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, 1, true); end.setUint16(10, 1, true);
  end.setUint32(12, 46 + nameB.length, true); end.setUint32(16, centralOffset, true);
  return new Blob([local, nameB, bytes, central, nameB, end], { type: 'application/zip' });
}

async function saveFile(filename, bytes) {
  if (downloadsApi) {
    try {
      await downloadsApi.save({ filename: filename + '.zip', data: zipOne(filename, bytes) });
      toast('Fichier enregistré : ' + filename + '.zip');
    } catch (e) {
      toast(e && e.code === 'declined' ? 'Export annulé' : 'Export indisponible ici');
    }
    return;
  }
  const url = URL.createObjectURL(new Blob([bytes]));
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  toast('Fichier exporté : ' + filename);
}

/** Exporte le modèle affiché (sans les effets ni le mannequin), dans sa pose de repos. */
function exportRoot() {
  const group = new THREE.Group();
  group.name = roundId === 'lineup' ? 'ZaapRush_lineup' : current[0].def.id;
  for (const c of current) {
    c.inst.update('still', 0, 0);
    group.add(c.inst.root.clone(true));
  }
  return group;
}
function fileBase() { return roundId === 'lineup' ? 'zaaprush_lineup' : current[0].def.id; }

document.getElementById('exp-glb').addEventListener('click', () => {
  const g = exportRoot();
  new THREE.GLTFExporter().parse(g, (res) => saveFile(fileBase() + '.glb', new Uint8Array(res)), { binary: true });
});
document.getElementById('exp-obj').addEventListener('click', () => {
  const g = exportRoot();
  g.updateMatrixWorld(true);
  saveFile(fileBase() + '.obj', new TextEncoder().encode(new THREE.OBJExporter().parse(g)));
});

let toastTimer = 0;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 2200);
}

/* ---------------------------------------------------------------- Boutons */
document.querySelectorAll('[data-anim]').forEach((b) => b.addEventListener('click', () => {
  mode = b.dataset.anim;
  document.querySelectorAll('[data-anim]').forEach((x) => x.classList.toggle('on', x === b));
}));
document.querySelectorAll('[data-view]').forEach((b) => b.addEventListener('click', () => setView(b.dataset.view)));

/* ---------------------------------------------------------------- Boucle */
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', () => { resize(); });

function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05);
  if (mode !== 'still') time += dt;
  for (const c of current) c.inst.update(mode, time, dt);
  if (camTarget) {
    camTarget.k = Math.min(1, camTarget.k + dt * 3);
    const k = ease(camTarget.k);
    camera.position.lerp(camTarget.pos, camTarget.k >= 1 ? 1 : k * 0.25);
    controls.target.lerp(camTarget.look, camTarget.k >= 1 ? 1 : k * 0.25);
    if (camTarget.k >= 1) camTarget = null;
  }
  controls.update();
  renderer.render(scene, camera);
}

resize();
showRound('r1');
loop();
</script>
</body>
