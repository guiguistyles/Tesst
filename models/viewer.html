/* =====================================================================
   3. FAMILIERS ET BOSS DU JEU — outils communs
   Squelettes paramétrables (oiseau, lapin, dragon, mouton, arbre,
   golem, manchot) : un familier et un boss partagent le même socle,
   chaque modèle garde sa propre fonction buildXxx().
   ===================================================================== */

/** Aura circulaire derrière une créature : disque, anneaux, piques qui tournent. */
function addAura(parent, o) {
  const R = o.R ?? 1.2;
  const g = joint('aura', parent, 0, o.y ?? 1, o.z ?? -0.6);
  const m1 = mat(o.c1, 0.45), m2 = mat(o.c2 ?? o.c1, 0.6), soft = mat(o.c1, 0.3, 0.14);
  g.add(at(cyl(R, R, 0.02, 40, soft), 0, 0, 0, Math.PI / 2));
  g.add(torus(R * 1.04, 0.035 * R, 6, 48, m1));
  g.add(torus(R * 0.78, 0.02 * R, 6, 40, m2));
  const spikes = joint('aura_piques', g);
  const n = o.spikes ?? 16;
  for (let i = 0; i < n; i++) {
    const a = (i / n) * TAU;
    spikes.add(at(cone(0.05 * R, (0.2 + (i % 2) * 0.12) * R, 4, i % 2 ? m1 : m2), Math.cos(a) * R * 1.16, Math.sin(a) * R * 1.16, 0, 0, 0, a - Math.PI / 2));
  }
  return { g, update(t) { spikes.rotation.z = -t * 0.25; spikes.children.forEach((s, i) => { s.scale.y = 1 + Math.sin(t * 5 + i) * 0.2; }); } };
}
/** Émetteur de particules montantes autour d'une créature. */
function moteEmitter(fxA, root, mats, rate = 8, rad = 1.2, life = 1.5) {
  let acc = 0;
  return (dt) => {
    acc += dt * rate;
    while (acc > 1) {
      acc--;
      const a = Math.random() * TAU, rr = rad * (0.4 + Math.random() * 0.8);
      fxA.mote(new V3(root.position.x + Math.cos(a) * rr, Math.random() * 0.5, root.position.z + Math.sin(a) * rr), mats[(Math.random() * mats.length) | 0], life + Math.random(), 0.8, CUBE_GEO, 0.3 + Math.random() * 0.3);
    }
  };
}
/** Couronne dorée à piques et gemme. */
function addCrown(parent, x, y, z, s = 1, gem = 0xff3b6b) {
  const g = joint('couronne', parent, x, y, z);
  const gold = mat(0xf2c14e, 0.35);
  g.add(cyl(0.2, 0.18, 0.1, 8, gold));
  for (let i = 0; i < 8; i++) { const a = (i / 8) * TAU; g.add(at(cone(0.045, 0.16, 4, gold), Math.cos(a) * 0.18, 0.12, Math.sin(a) * 0.18)); }
  g.add(at(crystal(0.05, 0.14, mat(gem, 0.6), 4), 0, 0.02, 0.2, Math.PI / 2));
  g.scale.setScalar(s);
  return g;
}
/** Cylindre orienté d'un point A vers un point B (rayons, poutres). */
function beamBetween(a, b, r, m) {
  const d = b.clone().sub(a);
  const c = cyl(r, r, 1, 8, m);
  c.castShadow = false;
  c.scale.y = d.length();
  c.position.copy(a).addScaledVector(d, 0.5);
  c.quaternion.setFromUnitVectors(new V3(0, 1, 0), d.normalize());
  return c;
}

/* ---------------------------------------------------------------- Socle OISEAU (Tofu, Tofu Royal) */
function birdBase(o = {}) {
  const S = o.scale ?? 1;
  const C = {
    body: mat(o.body ?? 0xffd23f), body2: mat(o.body2 ?? 0xf4b400), belly: mat(o.belly ?? 0xffe78a),
    beak: mat(0xf77f00), white: mat(0xffffff), dark: mat(0x1e1214), blush: mat(0xff8fab),
  };
  const root = new THREE.Group();
  root.name = o.name ?? 'Tofu';
  const fx = new THREE.Group();
  fx.name = root.name + '_fx';
  const rig = joint('echelle', root);
  rig.scale.setScalar(S);
  // Le tofu est une boule : la tête et le corps ne font qu'un
  const body = joint('corps', rig, 0, 0.36, 0);
  body.add(sph(0.26, 8, 6, C.body));
  body.add(at(sph(0.19, 8, 6, C.belly), 0, -0.05, 0.1));
  body.add(at(cone(0.075, 0.18, 4, C.beak), 0, 0.03, 0.31, Math.PI / 2, Math.PI / 4));
  const jaw = joint('bec_bas', body, 0, -0.01, 0.22);
  jaw.add(at(cone(0.05, 0.11, 4, C.beak), 0, 0, 0.06, Math.PI / 2, Math.PI / 4));
  for (const s of [-1, 1]) {
    body.add(at(box(0.075, 0.085, 0.02, C.white), s * 0.09, 0.1, 0.235));
    body.add(at(box(0.035, 0.055, 0.02, o.eyeMat ?? C.dark), s * 0.095, 0.1, 0.247));
    body.add(at(box(0.06, 0.03, 0.02, C.blush), s * 0.15, 0.0, 0.205));
    body.add(at(box(0.08, 0.02, 0.02, C.dark), s * 0.09, 0.16, 0.24, 0, 0, s * (o.angry ? 0.35 : -0.15)));
  }
  for (let i = -1; i <= 1; i++) body.add(at(cone(0.04, 0.16 - Math.abs(i) * 0.04, 4, C.body2), i * 0.05, 0.3, -0.02 - Math.abs(i) * 0.03, -0.3, 0, -i * 0.3));
  const wings = [];
  for (const s of [-1, 1]) {
    const w = joint('aile', body, s * 0.25, 0.0, 0);
    w.add(at(box(0.05, 0.16, 0.22, C.body2), s * 0.02, -0.03, 0, 0, 0, s * 0.3));
    w.add(at(cone(0.03, 0.1, 4, C.body2), s * 0.06, -0.13, -0.06, 0.4, 0, s * 0.3));
    wings.push({ w, s });
  }
  for (let i = -1; i <= 1; i++) body.add(at(cone(0.035, 0.18, 4, C.body2), i * 0.06, 0.06, -0.3, -1.1, 0, i * 0.3));
  const legs = [];
  for (const s of [-1, 1]) {
    const l = joint('patte', body, s * 0.09, -0.22, 0.02);
    l.add(at(cyl(0.018, 0.018, 0.12, 4, C.beak), 0, -0.06, 0));
    for (const a of [-0.5, 0, 0.5]) l.add(at(box(0.025, 0.02, 0.08, C.beak), Math.sin(a) * 0.03, -0.12, 0.03 + Math.cos(a) * 0.02, 0, a, 0));
    legs.push(l);
  }
  return { root, fx, rig, body, jaw, wings, legs, C, fxA: makeFx(fx) };
}
function animBird(b, mode, t, baseY = 0.36) {
  b.body.position.y = baseY; b.body.rotation.set(0, 0, 0); b.jaw.rotation.x = 0;
  b.legs.forEach((l) => l.rotation.set(0, 0, 0));
  let flap = 0;
  if (mode === 'idle') {
    b.body.position.y = baseY + Math.abs(Math.sin(t * 3)) * 0.02;
    b.body.rotation.z = Math.sin(t * 1.5) * 0.06;
    flap = Math.sin(t * 4) * 0.15;
  } else if (mode === 'move') {
    const h = Math.abs(Math.sin(t * 8));
    b.body.position.y = baseY + h * 0.22;
    b.body.rotation.x = 0.15 - h * 0.2;
    b.legs.forEach((l) => { l.rotation.x = -h * 0.8; });
    flap = 0.3 + Math.sin(t * 16) * 0.4;
  }
  b.wings.forEach(({ w, s }) => { w.rotation.z = s * flap; });
}
function miniTofu() {
  const g = new THREE.Group();
  g.add(at(sph(0.13, 6, 5, mat(0xffd23f)), 0, 0.15, 0));
  g.add(at(cone(0.04, 0.09, 4, mat(0xf77f00)), 0, 0.16, 0.15, Math.PI / 2));
  for (const s of [-1, 1]) g.add(at(box(0.03, 0.04, 0.01, mat(0x1e1214)), s * 0.05, 0.2, 0.125));
  return g;
}

/** FAMILIER COMMUN — Tofu Bagarreur : petite boule à plumes qui picore tout. */
function buildTofuBagarreur() {
  const b = birdBase({ name: 'TofuBagarreur', scale: 1, angry: true });

  b.body.add(at(torus(0.24, 0.025, 6, 20, mat(0xd62828)), 0, 0.14, 0, Math.PI / 2 - 0.15));
  b.body.add(at(box(0.04, 0.12, 0.02, mat(0xd62828)), 0.04, 0.12, -0.26, 0.4, 0, 0.5));
  const feather = [mat(0xffd23f), mat(0xf4b400)];
  function update(mode, t, dt) {
    animBird(b, mode, t);
    if (mode === 'ability') {
      // Rafale de coups de bec
      const { k, cross } = phase(t, dt, 1.6);
      const peck = k < 0.9 ? Math.max(0, Math.sin(k * 30)) : 0;
      b.body.rotation.x = 0.55 * peck;
      b.body.position.z = 0.08 * peck;
      b.jaw.rotation.x = 0.4 * peck;

    b.body.position.z = mode === 'ability' ? b.body.position.z : 0;

  return { root: b.root, fx: b.fx, update };
}

/** BOSS — Tofu Royal : tofu géant couronné qui écrase le sol et appelle ses sujets. */
function buildTofuRoyal() {
  const b = birdBase({ name: 'TofuRoyal', scale: 4.2, body: 0xffcc00, body2: 0xd06010, belly: 0xffe78a, angry: true });
  addCrown(b.body, 0, 0.27, 0, 0.75);
  // Cape royale et collier
  const cape = joint('cape', b.body, 0, 0.1, -0.2);
  cape.add(at(box(0.36, 0.3, 0.03, mat(0x8a1a2a)), 0, -0.12, -0.04, 0.35));
  cape.add(at(box(0.38, 0.04, 0.05, mat(0xf2c14e, 0.3)), 0, 0.02, -0.02, 0.35));
  b.body.add(at(torus(0.2, 0.02, 6, 20, mat(0xf2c14e, 0.3)), 0, -0.12, 0.02, Math.PI / 2 + 0.3));
  b.body.add(at(crystal(0.025, 0.08, mat(0xff3b6b, 0.6), 4), 0, -0.18, 0.21));
  const aura = addAura(b.root, { y: 1.6, z: -1.3, R: 1.5, c1: 0xffcf3a, c2: 0xff8a1a });
  const motes = moteEmitter(b.fxA, b.root, [mat(0xffcf3a, 0.5), mat(0xffffff, 0.3)], 6, 1.6);
  const orange = mat(0xff8a1a, 0.6), feather = [mat(0xffcc00), mat(0xd06010)];
  function update(mode, t, dt) {
    animBird(b, mode, t);
    if (mode === 'ability') {
      // Saut, atterrissage écrasant, puis 4 petits tofus jaillissent
      const { k, cross } = phase(t, dt, 3);
      const air = k > 0.3 && k < 1.0 ? Math.sin((k - 0.3) / 0.7 * Math.PI) : 0;
      const crouch = k < 0.3 ? ease(k / 0.3) : k > 1 && k < 1.4 ? 1 - ease((k - 1) / 0.4) : 0;
      b.body.position.y = 0.36 + air * 0.45 - crouch * 0.06;
      b.rig.scale.set(4.2 * (1 + crouch * 0.12), 4.2 * (1 - crouch * 0.15 + air * 0.05), 4.2 * (1 + crouch * 0.12));
      b.wings.forEach(({ w, s }) => { w.rotation.z = s * (air * 1.2); });
      if (cross(1.0)) {

/** FAMILIER ÉPIQUE — Wabbit Lunaire : lapin de nuit, croissant de lune et cawotte magique. */
function buildWabbitLunaire() {
  const w = wabbitBase({ name: 'WabbitLunaire', scale: 1.15 });
  const carrot = cawotte(1.1);
  const hold = joint('cawotte_prise', w.armR.hand, 0, -0.05, 0.02);
  hold.rotation.x = Math.PI / 2;
  hold.add(carrot);
  // Croissant de lune et étoiles derrière la tête
  const moonM = mat(0xfff2b0, 0.7);
  const moonG = joint('croissant', w.head, 0, 0.32, -0.28);
  moonG.add(at(torus(0.22, 0.05, 6, 20, moonM, Math.PI * 1.25), 0, 0, 0, 0, 0, Math.PI * 0.6));
  const stars = [];
  for (let i = 0; i < 5; i++) { const s = crystal(0.03, 0.1, moonM, 4); w.rig.add(s); stars.push(s); }
  const aura = addAura(w.rig, { y: 0.75, z: -0.4, R: 0.62, c1: 0xb48cff, c2: 0xfff2b0, spikes: 14 });
  const motes = moteEmitter(w.fxA, w.root, [mat(0xb48cff, 0.5), moonM], 5, 0.8, 1.2);
  const violet = mat(0xb48cff, 0.6);
  function update(mode, t, dt) {
    animWabbit(w, mode, t);
    carrot.visible = true;
    if (mode === 'ability') {
      // Lance la cawotte qui éclate en éclats de lune
      const { k, cross } = phase(t, dt, 2.2);
      const wind = k < 0.4 ? ease(k / 0.4) : k < 0.55 ? 1 - ease((k - 0.4) / 0.15) * 2 : k < 1 ? -1 + ease((k - 0.55) / 0.45) : 0;
      w.armR.sh.rotation.x = -2.6 * Math.max(0, wind) - 1.2 * Math.max(0, -wind);
      w.torso.rotation.y = 0.4 * wind;
      w.ears.forEach(({ e2 }) => { e2.rotation.x = 0.4 * Math.abs(wind); });
      carrot.visible = k < 0.5 || k > 1.6;
      if (cross(0.5)) {
        const start = wpos(w.armR.hand);
        const target = front({ root: w.root }, 2.6, 0, 0.1);
        const T = 0.6, g = 10;
        const v = target.clone().sub(start).divideScalar(T);
        v.y = (target.y - start.y) / T + 0.5 * g * T;
        w.fxA.proj(cawotte(1.6), start, v, { g, life: 2, spin: 12, ground: 0.12, trail: violet, trailSize: 0.5, end: (p) => {
          const pos = p.m.position.clone().setY(0.05);
          w.fxA.ring(pos, violet, 2.6, 0.6);
          w.fxA.burst(pos.clone().setY(0.2), [moonM, violet], 14, 2.5, 3, SPARK_GEO, 0.9);
        } });
      }
    }
    if (mode !== 'still') {
      moonG.rotation.z = Math.sin(t) * 0.2;
      stars.forEach((s, i) => { const a = (i / 5) * TAU + t * 0.8; s.position.set(Math.cos(a) * 0.55, 1.05 + Math.sin(t * 2 + i) * 0.08, Math.sin(a) * 0.55); s.rotation.y = t * 2; });
      aura.update(t); motes(dt); w.fxA.update(dt);
    }
  }
  return { root: w.root, fx: w.fx, update };
}

  const head = joint('tete', torso, 0, 0.8, 0.2);

function animGolem(g, mode, t) {
  g.hips.position.y = 0.7; g.torso.rotation.set(0, 0, 0); g.head.rotation.set(0, 0, 0);
  g.legs.forEach(({ l, k }) => { l.rotation.set(0, 0, 0); k.rotation.set(0, 0, 0); });
  g.arms.forEach(({ a, e, s }) => { a.rotation.set(0, 0, s * 0.15); e.rotation.set(-0.3, 0, 0); });
  if (mode === 'idle' || mode === 'ability') {
    g.torso.scale.y = 1 + Math.sin(t * 1.4) * 0.015;
    g.head.rotation.y = Math.sin(t * 0.5) * 0.25;
  } else if (mode === 'move') {
    const w = t * 3.2;
    g.legs.forEach(({ l, k }, i) => { l.rotation.x = Math.sin(w + i * Math.PI) * 0.4; k.rotation.x = Math.max(0, Math.sin(w + i * Math.PI + 1)) * 0.5; });
    g.arms.forEach(({ a }, i) => { a.rotation.x = Math.sin(w + i * Math.PI + Math.PI) * 0.4; });
    g.torso.rotation.z = Math.sin(w) * 0.06;
    g.hips.position.y = 0.7 + Math.abs(Math.sin(w)) * 0.03;
  }
}
/** Ability commune des golems : coup double au sol, onde, rochers projetés (et pics de cristal en option). */
function golemSlam(g, mode, t, dt, o) {
  if (mode !== 'ability') return;
  const { k, cross } = phase(t, dt, 3);
  const up = k < 0.7 ? ease(k / 0.7) : 0;
  const slam = k >= 0.7 && k < 0.85 ? ease((k - 0.7) / 0.15) : k >= 0.85 && k < 1.8 ? 1 : k >= 1.8 ? 1 - ease(clamp01((k - 1.8) / 0.7)) : 0;
  g.arms.forEach(({ a }) => { a.rotation.x = -2.9 * up - 1.0 * slam; });
  g.torso.rotation.x = -0.25 * up + 0.5 * slam;
  g.hips.position.y = 0.7 - 0.12 * slam;
  g.legs.forEach(({ k: kn }) => { kn.rotation.x = 0.5 * slam; });
  if (cross(0.85)) {
    const c = front({ root: g.root }, o.dist, 0, 0.05);
    g.fxA.ring(c, o.ring, o.dist * 2, 0.8);
    g.fxA.ring(c.clone().setY(0.1), o.ring2, o.dist * 1.2, 0.6);
    g.fxA.puff(c, o.dust, 14, 1.1, 2.5);
    for (let i = 0; i < 10; i++) {
      const a = Math.random() * TAU;
      const rockM = box(0.3, 0.26, 0.3, Math.random() < 0.5 ? g.mats.rock : g.mats.rock2);
      g.fxA.proj(rockM, c.clone().setY(0.3), new V3(Math.cos(a) * 3, 5 + Math.random() * 3, Math.sin(a) * 3), { g: 12, life: 2, spin: 5, ground: 0.13, end: (p) => g.fxA.puff(p.m.position, o.dust, 2, 0.5, 0.3) });
    }
    if (o.spikes) for (let i = 0; i < 14; i++) {
      const a = (i / 14) * TAU, rr = 1.6 + (i % 2) * 0.8;
      const pos = c.clone().add(new V3(Math.cos(a) * rr, -0.05, Math.sin(a) * rr));
      const sp = crystal(0.18, 1.2 + Math.random() * 0.8, o.spikes, 5);
      sp.position.copy(pos);
      sp.rotation.set(Math.sin(a) * 0.35, 0, -Math.cos(a) * 0.35);
      g.fxA.obj(sp, 1.5, (p, d, kk) => { const age = p.max - p.life; p.m.scale.set(1, Math.min(1, age * 6) * Math.min(1, kk * 3), 1); });
    }
  }
}

  { id: 'modo_pandawa', name: 'Pandawa Modo', rarity: 'MYTHIQUE', drop: 0.05, round: 'r2', build: buildModoPandawa },
  { id: 'modo_sadida', name: 'Sadida Modo', rarity: 'MYTHIQUE', drop: 0.05, round: 'r2', build: buildModoSadida },
  { id: 'tofu_bagarreur', name: 'Tofu Bagarreur', rarity: 'COMMUN', drop: 35, round: 'r3', build: buildTofuBagarreur },
  { id: 'wabbit_lunaire', name: 'Wabbit Lunaire', rarity: 'ÉPIQUE', drop: 3, round: 'r3', build: buildWabbitLunaire },
  { id: 'dragoeuf_celeste', name: 'Dragoeuf Céleste', rarity: 'MYTHIQUE', drop: 0.2, round: 'r3', build: buildDragoeufCeleste },
  { id: 'tofu_royal', name: 'Tofu Royal', rarity: 'ÉPIQUE', drop: 5, round: 'r4', build: buildTofuRoyal },
  { id: 'bouftou_royal', name: 'Bouftou Royal', rarity: 'LÉGENDAIRE', drop: 1.5, round: 'r4', build: buildBouftouRoyal },
  { id: 'black_wabbit', name: 'Black Wabbit', rarity: 'ÉPIQUE', drop: 4, round: 'r4', build: buildBlackWabbit },
  { id: 'dragon_cochon', name: 'Dragon Cochon', rarity: 'LÉGENDAIRE', drop: 1, round: 'r4', build: buildDragonCochon },
  { id: 'abrak_ancestral', name: 'Abraknyde Ancestral', rarity: 'ÉPIQUE', drop: 3, round: 'r4', build: buildAbraknydeAncestral },
  { id: 'chene_mou', name: 'Le Chêne Mou', rarity: 'LÉGENDAIRE', drop: 0.8, round: 'r4', build: buildCheneMou },
  { id: 'craq_plaines', name: 'Craqueleur des Plaines', rarity: 'ÉPIQUE', drop: 3, round: 'r4', build: buildCraqueleurPlaines },
  { id: 'craq_legendaire', name: 'Craqueleur Légendaire', rarity: 'LÉGENDAIRE', drop: 0.5, round: 'r4', build: buildCraqueleurLegendaire },
  { id: 'mansot_royal', name: 'Mansot Royal', rarity: 'ÉPIQUE', drop: 2, round: 'r4', build: buildMansotRoyal },
  { id: 'obsidiantre', name: 'Obsidiantre', rarity: 'LÉGENDAIRE', drop: 0.3, round: 'r4', build: buildObsidiantre },
];
const ROUNDS = [
  { id: 'r1', label: 'Round 1 · Légendaire' },
  { id: 'r2', label: 'Round 2 · Boss Modo' },
  { id: 'r3', label: 'Round 3 · Familiers' },
  { id: 'r4', label: 'Round 4 · Boss du jeu' },
  { id: 'lineup', label: 'Full lineup' },
];

/* =====================================================================
   Scène, lumière, sol, mannequin d'échelle, lune
   ===================================================================== */
const canvas = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeceae6);
scene.fog = new THREE.Fog(0xeceae6, 18, 40);

const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 800);
const controls = new THREE.OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 1.5;
controls.maxDistance = 400;
controls.maxPolarAngle = Math.PI * 0.49;

scene.add(new THREE.HemisphereLight(0xffffff, 0xd8d2c8, 0.75));
const sun = new THREE.DirectionalLight(0xffffff, 0.9);
sun.position.set(4, 8, 5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.radius = 6;
sun.shadow.bias = -0.0005;
Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8, near: 1, far: 30 });
scene.add(sun);

// Sol blanc qui reçoit l'ombre portée
const floor = new THREE.Mesh(new THREE.CylinderGeometry(14, 14, 0.1, 64), new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1 }));
floor.position.y = -0.05;
floor.receiveShadow = true;
scene.add(floor);

// Lune en arrière-plan
const moon = new THREE.Group();
moon.add(new THREE.Mesh(new THREE.SphereGeometry(2.2, 20, 14), mat(0xf3ead6, 0.15)));
for (const [x, y, r] of [[0.6, 0.5, 0.4], [-0.7, -0.3, 0.55], [0.2, -0.9, 0.3], [-0.2, 0.9, 0.25]]) {
  const c = new THREE.Mesh(new THREE.SphereGeometry(r, 10, 8), mat(0xe0d4ba, 0.1));
  c.position.set(x, y, 1.85);
  moon.add(c);
}
moon.position.set(-6, 7, -14);
scene.add(moon);

/** Mannequin gris de 1,80 m pour l'échelle. */
function buildMannequin() {
  const g = new THREE.Group();
  g.name = 'Mannequin_1m80';
  const m = mat(0x9a9894);
  g.add(at(box(0.36, 0.56, 0.2, m), 0, 1.2, 0));
  g.add(at(box(0.24, 0.24, 0.22, m), 0, 1.66, 0));
  for (const s of [-1, 1]) {
    g.add(at(box(0.11, 0.6, 0.12, m), s * 0.25, 1.17, 0));
    g.add(at(box(0.14, 0.88, 0.15, m), s * 0.1, 0.46, 0));
  }
  g.add(at(box(0.36, 0.04, 0.2, mat(0x7a7874)), 0, 1.8, 0));
  return g;
}
const mannequin = buildMannequin();
scene.add(mannequin);

/* =====================================================================
   État de la visionneuse
   ===================================================================== */
let mode = 'idle';
let current = [];       // instances affichées { def, inst }
let roundId = 'r1';
let pickId = null;     // créature choisie dans le Round affiché
let viewName = '34';
const clock = new THREE.Clock();
let time = 0;

function countTris(obj) {
  let n = 0;
  obj.traverse((o) => {
    if (o.isMesh) n += o.geometry.index ? o.geometry.index.count / 3 : o.geometry.attributes.position.count / 3;
  });
  return Math.round(n);
}
// Taille du corps seul : on ignore l'aura et les objets qui gravitent autour
const NOT_BODY = /^(aura|pierre_|engrenage_|cristaux_orbite|cristal_)/;
function sizeOf(obj) {
  obj.updateMatrixWorld(true);
  const b = new THREE.Box3(), tmpBox = new THREE.Box3();
  (function walk(o) {
    if (NOT_BODY.test(o.name)) return;
    if (o.isMesh) {
      if (!o.geometry.boundingBox) o.geometry.computeBoundingBox();
      b.union(tmpBox.copy(o.geometry.boundingBox).applyMatrix4(o.matrixWorld));
    }
    o.children.forEach(walk);
  })(obj);
  const s = new THREE.Vector3();
  b.getSize(s);
  return { box: b, h: s.y, w: Math.max(s.x, s.z) };
}

function clearScene() {
  for (const c of current) { scene.remove(c.inst.root); scene.remove(c.inst.fx); }
  current = [];
}

function showRound(id) {
  roundId = id;
  clearScene();
  const group = id === 'lineup' ? CREATURES : CREATURES.filter((c) => c.round === id);
  if (!group.some((c) => c.id === pickId)) pickId = group[0].id;
  // Dans un Round, une créature à la fois ; le lineup les aligne toutes
  const list = id === 'lineup' ? group : group.filter((c) => c.id === pickId);
  // Chaque créature prend la place de sa largeur (corps seul) + une marge
  const built = list.map((def) => { const inst = def.build(); inst.update('still', 0, 0); return { def, inst, w: sizeOf(inst.root).w }; });
  const total = built.reduce((n, c) => n + c.w + 1.4, -1.4);
  let x = -total / 2;
  for (const c of built) {
    c.inst.root.position.x = list.length > 1 ? x + c.w / 2 : 0;
    x += c.w + 1.4;
    scene.add(c.inst.root, c.inst.fx);
    current.push({ def: c.def, inst: c.inst });
  }
  // Mannequin à gauche de la rangée, sol et brouillard adaptés à la largeur
  const half = list.length > 1 ? total / 2 : 0;
  // Mannequin juste à gauche, à une distance qui dépend de la largeur de la créature
  const firstW = current.length ? sizeOf(current[0].inst.root).w : 1;
  mannequin.position.set(-half - Math.max(1.1, firstW * 0.6 + 0.6), 0, 0.3);
  const span = Math.max(14, half + 8);
  floor.scale.set(span / 14, 1, Math.max(1, span / 28));
  scene.fog.near = Math.max(18, span * 1.4);
  scene.fog.far = Math.max(40, span * 3.2);
  Object.assign(sun.shadow.camera, { left: -span, right: span, top: span * 0.6, bottom: -span * 0.6 });
  sun.shadow.camera.updateProjectionMatrix();
  updateInfo();
  renderTabs();
  renderPicks(id === 'lineup' ? [] : group);
  setView(viewName, true);
}

function renderPicks(group) {
  const nav = document.getElementById('picks');
  nav.innerHTML = '';
  if (group.length < 2) return;
  for (const c of group) {
    const b = document.createElement('button');
    b.className = 'pick' + (c.id === pickId ? ' on' : '');
    b.textContent = c.name;
    b.addEventListener('click', () => { pickId = c.id; showRound(roundId); });
    nav.appendChild(b);
  }
  const on = nav.querySelector('.on');
  if (on) on.scrollIntoView({ block: 'nearest', inline: 'center' });
}

function updateInfo() {
  const first = current[0];
  if (!first) return;
  const lineup = roundId === 'lineup' && current.length > 1;
  const def = first.def;
  document.getElementById('c-name').textContent = lineup ? `Lineup · ${current.length} créatures` : def.name;
  const r = document.getElementById('c-rarity');
  r.textContent = lineup ? 'TOUTES' : def.rarity;
  r.style.background = lineup ? '#f4ecdd' : RARITY[def.rarity];
  document.getElementById('c-drop').textContent = lineup ? '—' : def.drop.toLocaleString('fr-FR') + ' %';
  for (const c of current) c.inst.update('still', 0, 0);
  const h = Math.max(...current.map((c) => sizeOf(c.inst.root).h));
  document.getElementById('c-size').textContent = h.toLocaleString('fr-FR', { maximumFractionDigits: 1 }) + ' m';
  const tris = current.reduce((n, c) => n + countTris(c.inst.root), 0);
  document.getElementById('c-tris').textContent = tris.toLocaleString('fr-FR');
}

function renderTabs() {
  const nav = document.getElementById('tabs');
  nav.innerHTML = '';
  for (const r of ROUNDS) {
    const b = document.createElement('button');
    b.className = 'tab' + (r.id === roundId ? ' on' : '');
    b.textContent = r.soon ? r.label + ' (bientôt)' : r.label;
    b.disabled = !!r.soon;
    b.addEventListener('click', () => showRound(r.id));
    nav.appendChild(b);
  }
}

/* ---------------------------------------------------------------- Caméra */
function setView(name, instant) {
  viewName = name;
  const boxAll = new THREE.Box3();
  for (const c of current) boxAll.expandByObject(c.inst.root);
  boxAll.expandByObject(mannequin);
  const center = new THREE.Vector3(), size = new THREE.Vector3();
  boxAll.getCenter(center);
  boxAll.getSize(size);
  // FZ : on vise un peu devant les créatures, là où tombent les effets d'Ability
  const FZ = current.length > 1 ? 0 : 1.2;
  const r = current.length > 1 ? Math.max((size.x / 2) / (Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.aspect) * 1.3 / 0.92, 8) : Math.max(size.y * 2.25, size.x * 1.3, 4.4);
  const pos = {
    '34': new THREE.Vector3(center.x + r * (current.length > 1 ? 0.08 : 0.62), center.y + r * 0.32, FZ + r * 0.92),
    face: new THREE.Vector3(center.x, center.y + r * 0.12, FZ + r * 1.1),
    side: new THREE.Vector3(center.x + r * 1.1, center.y + r * 0.12, FZ),
  }[name];
  // Brouillard réglé sur la distance de la caméra : le fond s'estompe, jamais les créatures
  scene.fog.near = r * 1.6;
  scene.fog.far = r * 4;
  camTarget = { pos, look: new THREE.Vector3(center.x, size.y * 0.42, FZ), k: instant ? 1 : 0 };
  document.querySelectorAll('[data-view]').forEach((b) => b.classList.toggle('on', b.dataset.view === name));
}
let camTarget = null;

/* ---------------------------------------------------------------- Export GLB / OBJ */
// Dans un artefact claude.ai, les fichiers passent par la capacité "downloads",
// qui n'accepte pas .glb/.obj : on les emballe alors dans un .zip.
let downloadsApi = null;
if (window.claude && typeof window.claude.use === 'function') {
  window.claude.use('downloads').then((d) => { downloadsApi = d; }).catch(() => {});
}

const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
  return t;
})();
function crc32(bytes) {
  let c = 0xffffffff;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);
  return (c ^ 0xffffffff) >>> 0;
}
/** Archive .zip minimale, sans compression (méthode "stored"), d'un seul fichier. */
function zipOne(name, bytes) {
  const nameB = new TextEncoder().encode(name);
  const crc = crc32(bytes);
  const local = new DataView(new ArrayBuffer(30));
  local.setUint32(0, 0x04034b50, true); local.setUint16(4, 20, true);
  local.setUint32(14, crc, true); local.setUint32(18, bytes.length, true); local.setUint32(22, bytes.length, true);
  local.setUint16(26, nameB.length, true);
  const central = new DataView(new ArrayBuffer(46));
  central.setUint32(0, 0x02014b50, true); central.setUint16(4, 20, true); central.setUint16(6, 20, true);
  central.setUint32(16, crc, true); central.setUint32(20, bytes.length, true); central.setUint32(24, bytes.length, true);
  central.setUint16(28, nameB.length, true);
  const centralOffset = 30 + nameB.length + bytes.length;
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, 1, true); end.setUint16(10, 1, true);
  end.setUint32(12, 46 + nameB.length, true); end.setUint32(16, centralOffset, true);
  return new Blob([local, nameB, bytes, central, nameB, end], { type: 'application/zip' });
}

async function saveFile(filename, bytes) {
  if (downloadsApi) {
    try {
      await downloadsApi.save({ filename: filename + '.zip', data: zipOne(filename, bytes) });
      toast('Fichier enregistré : ' + filename + '.zip');
    } catch (e) {
      toast(e && e.code === 'declined' ? 'Export annulé' : 'Export indisponible ici');
    }
    return;
  }
  const url = URL.createObjectURL(new Blob([bytes]));
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  toast('Fichier exporté : ' + filename);
}

/** Exporte le modèle affiché (sans les effets ni le mannequin), dans sa pose de repos. */
function exportRoot() {
  const group = new THREE.Group();
  group.name = roundId === 'lineup' ? 'ZaapRush_lineup' : current[0].def.id;
  for (const c of current) {
    c.inst.update('still', 0, 0);
    group.add(c.inst.root.clone(true));
  }
  return group;
}
function fileBase() { return roundId === 'lineup' ? 'zaaprush_lineup' : current[0].def.id; }

document.getElementById('exp-glb').addEventListener('click', () => {
  const g = exportRoot();
  new THREE.GLTFExporter().parse(g, (res) => saveFile(fileBase() + '.glb', new Uint8Array(res)), { binary: true });
});
document.getElementById('exp-obj').addEventListener('click', () => {
  const g = exportRoot();
  g.updateMatrixWorld(true);
  saveFile(fileBase() + '.obj', new TextEncoder().encode(new THREE.OBJExporter().parse(g)));
});

let toastTimer = 0;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 2200);
}

/* ---------------------------------------------------------------- Boutons */
document.querySelectorAll('[data-anim]').forEach((b) => b.addEventListener('click', () => {
  mode = b.dataset.anim;
  document.querySelectorAll('[data-anim]').forEach((x) => x.classList.toggle('on', x === b));
}));
document.querySelectorAll('[data-view]').forEach((b) => b.addEventListener('click', () => setView(b.dataset.view)));

/* ---------------------------------------------------------------- Boucle */
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', () => { resize(); });

function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05);
  if (mode !== 'still') time += dt;
  for (const c of current) c.inst.update(mode, time, dt);
  if (camTarget) {
    camTarget.k = Math.min(1, camTarget.k + dt * 3);
    const k = ease(camTarget.k);
    camera.position.lerp(camTarget.pos, camTarget.k >= 1 ? 1 : k * 0.25);
    controls.target.lerp(camTarget.look, camTarget.k >= 1 ? 1 : k * 0.25);
    if (camTarget.k >= 1) camTarget = null;
  }
  controls.update();
  renderer.render(scene, camera);
}

resize();
showRound('r1');
loop();
</script>
