# Compile l'APK sur les serveurs de GitHub (aucun PC nécessaire)
# et le publie dans « Releases » pour le télécharger depuis le téléphone.
name: Compiler l'APK

on:
  push:
    branches: [ "main", "claude/jarvis-android-voice-assistant-hqxhdh" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compiler l'APK et lancer les tests
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug testDebugUnitTest --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk Jarvis.apk

      - name: Conserver l'APK (onglet Actions)
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-apk
          path: Jarvis.apk

      - name: Publier l'APK (page Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-debug
          name: Jarvis — APK à installer
          prerelease: true
          body: |
            Téléchargez **Jarvis.apk** ci-dessous depuis votre téléphone, puis ouvrez-le pour l'installer.
            Compilé automatiquement à partir du commit ${{ github.sha }}.
          files: Jarvis.apk
